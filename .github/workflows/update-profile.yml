name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:     # Allows manual run from Actions tab anytime
  push:
    branches:
      - main
    paths-ignore:
      - 'dark.svg'
      - 'light.svg'
      - 'README.md'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Stats Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.js

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --staged --quiet || (git commit -m "Auto-update profile stats and top languages [skip ci]" && git push)
